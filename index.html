<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>The Pawns Game – Chess.com </title>
    <style>
        :root {
            --bg-color: #0d0d12; --panel-bg: #161622;
            --light-square: #8b5cf6; --dark-square: #1e1b4b;
            --accent-pink: #ec4899; --valid-green: #10b981; --text-main: #f3f4f6;
            --premove: #f59e0b; --time-good: #10b981; --time-low: #f59e0b; --time-critical: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: radial-gradient(circle at 50% 50%, #2e1065 0%, #0d0d12 100%); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .game-counter { text-align:center; font-size:0.95rem; color:#a78bfa; margin-bottom:5px; }
        .game-counter strong { color:#ffd700; font-size:1.1rem; }
        h1 { font-size: 2rem; background: linear-gradient(to right, #00f2ff, #ff007f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #a78bfa; margin-bottom: 15px; text-align: center; }
        .time-bar { display:flex; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
        .time-box { flex:1; min-width:140px; background:rgba(0,0,0,0.4); border-radius:10px; padding:10px 12px; text-align:center; border:2px solid transparent; transition:0.2s; }
        .time-box.active { border-color:#ffd700; box-shadow:0 0 12px rgba(255,215,0,0.3); }
        .time-box .label { font-size:0.8rem; color:#aaa; margin-bottom:3px; }
        .time-box .time { font-size:1.5rem; font-weight:bold; font-variant-numeric:tabular-nums; }
        .time.good { color:var(--time-good); }
        .time.low { color:var(--time-low); animation:slowPulse 1.5s infinite; }
        .time.critical { color:var(--time-critical); animation:fastPulse 0.6s infinite; }
        @keyframes slowPulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }
        @keyframes fastPulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
        .main-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 850px; margin: 0 auto; }
        .game-section { flex: 1 1 400px; }
        .history-section { flex: 1 1 260px; background: var(--panel-bg); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .status-bar { background: rgba(0,0,0,0.4); padding: 12px 15px; border-radius:10px; margin-bottom:15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; flex-wrap: wrap; gap:5px; }
        .ai-status { color: #ff007f; }
        .board-container { position: relative; margin: 0 auto; }
        .rank-labels { position: absolute; top: 0; left: -20px; height: 100%; display: flex; flex-direction: column; justify-content: space-around; }
        .rank-label { color: #a78bfa; height: 55px; display: flex; align-items: center; font-weight: bold; }
        #board { display: grid; grid-template-columns: repeat(8, 55px); grid-template-rows: repeat(8, 55px); border: 5px solid #4c1d95; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .file-labels { display: grid; grid-template-columns: repeat(8, 55px); margin-top: 5px; }
        .file-label { color: #a78bfa; text-align: center; font-weight: bold; }
        .square { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: background 0.15s; }
        .light-sq { background: var(--light-square); }
        .dark-sq { background: var(--dark-square); }
        .piece { font-size: 2.4rem; user-select: none; transition: transform 0.1s; }
        .square:hover .piece { transform: scale(1.1); }
        .white-piece { color: #00f2ff; filter: drop-shadow(0 0 8px rgba(0,242,255,0.9)); }
        .black-piece { color: #ff007f; filter: drop-shadow(0 0 8px rgba(255,0,127,0.9)); }
        .selected-sq { background: rgba(236,72,153,0.5) !important; box-shadow: inset 0 0 12px var(--accent-pink); }
        .move-indicator { width: 16px; height: 16px; background: var(--valid-green); border-radius: 50%; position: absolute; box-shadow: 0 0 10px var(--valid-green); }
        .capture-indicator { width: 80%; height: 80%; border: 3px dashed #f59e0b; border-radius: 50%; position: absolute; animation: rotate 8s linear infinite; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .history-section h3 { color: #a78bfa; margin-bottom: 12px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .history-list { max-height: 220px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 8px; margin-bottom: 10px; }
        .history-item { padding: 6px; margin: 3px 0; border-radius: 5px; cursor: pointer; font-family: monospace; font-size: 0.9rem; transition: background 0.1s; }
        .history-item:hover { background: rgba(139,92,246,0.2); }
        .history-item.active { background: rgba(139,92,246,0.4); border-left: 3px solid #8b5cf6; }
        .history-item.white { color: #00f2ff; }
        .history-item.black { color: #ff007f; }
        .share-area { margin-top:10px; display:flex; gap:5px; flex-direction:column; }
        .share-text { width:100%; min-height:90px; background:#0005; border:1px solid #444; border-radius:8px; padding:8px; color:#ddd; font-size:0.8rem; resize:none; }
        .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button { padding: 10px 16px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size:0.9rem; }
        .btn-new { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; box-shadow: 0 5px 20px rgba(236,72,153,0.4); }
        .btn-new:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(236,72,153,0.6); }
        .btn-copy { background:#10b981; color:white; }
        .btn-copy:hover { background:#059669; }
        .btn-analyze { background:#f59e0b; color:white; }
        .btn-analyze:hover { background:#d97706; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 999; padding:15px; }
        .modal-content { background: var(--panel-bg); padding: 25px; border-radius: 20px; text-align: center; border: 2px solid #8b5cf6; max-width: 500px; width:100%; max-height:90vh; overflow-y:auto; }
        .modal h2 { font-size: 1.8rem; margin-bottom: 15px; background: linear-gradient(to right, #00f2ff, #ff007f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal-actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:15px; }
        .analysis-text { width:100%; min-height:150px; background:#0005; border:1px solid #444; border-radius:8px; padding:10px; color:#ddd; font-size:0.85rem; font-family:monospace; resize:none; margin:10px 0; }
        .close-btn { position:absolute; top:15px; right:15px; background:#ef4444; color:white; border:none; border-radius:50%; width:36px; height:36px; font-size:1.2rem; cursor:pointer; }
        .thinking { color: #ffd700; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .copied-msg { color:#10b981; font-size:0.85rem; margin-top:5px; display:none; }
        .copied-msg.show { display:block; }
        @media (max-width: 480px) {
            #board { grid-template-columns: repeat(8,42px); grid-template-rows: repeat(8,42px); }
            .file-labels { grid-template-columns: repeat(8,42px); }
            .rank-label { height: 42px; font-size:0.8rem; }
            .rank-labels { left: -17px; }
            .piece { font-size: 1.8rem; }
            .time-box { min-width:130px; }
            .time-box .time { font-size:1.3rem; }
        }
    </style>
</head>
<body>

    <div class="game-counter">MATCH: <strong id="gameCount">1</strong> • Oras: 60+2 • AI: Mabilis</div>
    <h1>♟️ THE PAWNS GAME ♟️</h1>
    <div class="subtitle"> ♟️♟️</div>

    <div class="time-bar">
        <div class="time-box" id="whiteBox">
            <div class="label">👤 IKAW (WHITE)</div>
            <div class="time good" id="whiteTime">0:60</div>
        </div>
        <div class="time-box" id="blackBox">
            <div class="label">🤖 AI (BLACK)</div>
            <div class="time good" id="blackTime">0:60</div>
        </div>
    </div>

    <div class="main-container">
        <div class="game-section">
            <div class="status-bar">
                <div>TURN: <span id="turnDisplay">WHITE</span></div>
                <div class="ai-status" id="aiStatus">Ready</div>
            </div>

            <div class="board-container" id="boardWrapper">
                <div class="rank-labels">
                    <div class="rank-label">8</div><div class="rank-label">7</div><div class="rank-label">6</div>
                    <div class="rank-label">5</div><div class="rank-label">4</div><div class="rank-label">3</div>
                    <div class="rank-label">2</div><div class="rank-label">1</div>
                </div>
                <div id="board"></div>
            </div>
            <div class="file-labels">
                <div class="file-label">a</div><div class="file-label">b</div><div class="file-label">c</div>
                <div class="file-label">d</div><div class="file-label">e</div><div class="file-label">f</div>
                <div class="file-label">g</div><div class="file-label">h</div>
            </div>

            <div class="controls">
                <button class="btn-new" onclick="resetGame()">🔄 New Game</button>
                <button class="btn-analyze" onclick="showAnalysis()">📋 Analyze & Copy Game</button>
            </div>
        </div>

        <div class="history-section">
            <h3>📜 GAME MOVES</h3>
            <div class="history-list" id="historyList">
                <p style="color:#666;text-align:center;">No moves yet...</p>
            </div>
            <div class="share-area">
                <textarea id="shareOutput" class="share-text" readonly placeholder="I-click ang 'Analyze & Copy' para makuha ang buong laro..."></textarea>
                <button class="btn-copy" onclick="copyHistory()">📋 Copy</button>
                <div class="copied-msg" id="copiedMsg">✅ Copied!</div>
            </div>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 id="resultTitle">GAME OVER</h2>
            <p style="margin-bottom: 15px; color:#ccc;" id="resultMsg"></p>
            
            <textarea id="finalGameText" class="analysis-text" readonly></textarea>
            
            <div class="modal-actions">
                <button class="btn-copy" onclick="copyFinalGame()">📋 Kopyahin ang Laro</button>
                <button class="btn-new" onclick="startNewGame()">🔄 New Game</button>
            </div>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const turnDisplay = document.getElementById('turnDisplay');
        const aiStatus = document.getElementById('aiStatus');
        const winModal = document.getElementById('winModal');
        const resultTitle = document.getElementById('resultTitle');
        const resultMsg = document.getElementById('resultMsg');
        const historyList = document.getElementById('historyList');
        const shareOutput = document.getElementById('shareOutput');
        const copiedMsg = document.getElementById('copiedMsg');
        const gameCountEl = document.getElementById('gameCount');
        const whiteTimeEl = document.getElementById('whiteTime');
        const blackTimeEl = document.getElementById('blackTime');
        const whiteBox = document.getElementById('whiteBox');
        const blackBox = document.getElementById('blackBox');
        const finalGameText = document.getElementById('finalGameText');

        // TUNOG MULA SA CHESS.COM
        const moveAudio = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3');
        const captureAudio = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3');
        const selectAudio = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/select.mp3');
        const winAudio = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/notify.mp3');
        const captureAudio = new Audio(' http://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-opponent.mp3');
        moveAudio.preload = 'auto';
        captureAudio.preload = 'auto';
        selectAudio.preload = 'auto';
        winAudio.preload = 'auto';

        // ✅ INAYOS NA PLAYSOUND FUNCTION
        function playSound(type){
            try {
                if(type === 'move') {
                    moveAudio.currentTime = 0;
                    moveAudio.play();
                }
                if(type === 'capture' || type === 'enpassant') {
                    captureAudio.currentTime = 0;
                    captureAudio.play();
                }
                if(type === 'select') {
                    selectAudio.currentTime = 0;
                    selectAudio.play();
                }
                if(type === 'win') {
                    winAudio.currentTime = 0;
                    winAudio.play();
                }
            } catch(e) {
                console.log('I-click muna ang screen:', e);
            }
        }

        const START_TIME = 30;
        const INCREMENT = 2;
        const MAX_DEPTH = 6;

        let totalGamesPlayed = 1;
        let history = [];
        let currentBoard = [];
        let turn = 'white';
        let selected = null;
        let validMoves = [];
        let gameOver = false;
        let isAiThinking = false;
        let enPassantTarget = null;
        let whiteTime = START_TIME;
        let blackTime = START_TIME;
        let timerInterval = null;

        function formatTime(secs){
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s.toString().padStart(2,'0')}`;
        }

        function updateTimeDisplay(){
            whiteTimeEl.textContent = formatTime(whiteTime);
            blackTimeEl.textContent = formatTime(blackTime);
            [whiteTimeEl, blackTimeEl].forEach((el,i)=>{
                const t = i===0 ? whiteTime : blackTime;
                el.classList.remove('good','low','critical');
                if(t <= 5) el.classList.add('critical');
                else if(t <= 10) el.classList.add('low');
                else el.classList.add('good');
            });
            whiteBox.classList.toggle('active', turn==='white');
            blackBox.classList.toggle('active', turn==='black');
        }

        function startTimer(){
            stopTimer();
            timerInterval = setInterval(()=>{
                if(gameOver) return;
                if(turn==='white') whiteTime -= 0.1;
                else blackTime -= 0.1;
                if(whiteTime <= 0) { gameOver=true; stopTimer(); showWin('black'); return; }
                if(blackTime <= 0) { gameOver=true; stopTimer(); showWin('white'); return; }
                updateTimeDisplay();
            }, 100);
        }

        function stopTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
        function addTime(color){ if(color==='white') whiteTime += INCREMENT; else blackTime += INCREMENT; updateTimeDisplay(); }
        function toNotation(r,c){ const files = 'abcdefgh'; return files[c] + (8 - r); }
        
        function getGameText(){
            if(history.length === 0) return 'No moves yet.';
            let text = `--- LABAN ${totalGamesPlayed} ---\nOras: 30+2\n\n`;
            history.forEach((s,i)=>{
                text += `${Math.floor(i/2)+1}. ${s.notation} `;
                if(i%2===1) text += '\n';
            });
            return text.trim();
        }

        function saveState(moveNotation){
            history.push({ board: currentBoard.map(row => [...row]), turn: turn, notation: moveNotation, enPassantTarget: enPassantTarget ? {...enPassantTarget} : null });
            updateHistoryUI();
            updateShareText();
        }

        function initBoard(){
            currentBoard = Array(8).fill(null).map(()=>Array(8).fill(null));
            for(let c=0;c<8;c++) currentBoard[1][c]='b';
            for(let c=0;c<8;c++) currentBoard[6][c]='w';
            turn='white'; selected=null; validMoves=[]; gameOver=false;
            enPassantTarget = null; history = [];
            whiteTime = START_TIME; blackTime = START_TIME;
            stopTimer();
            updateUI();
            updateTimeDisplay();
            updateShareText();
            setTimeout(startTimer, 500);
        }

        function hasAnyMoves(b,color,epTarget=null){
            const oldEP = enPassantTarget; enPassantTarget = epTarget;
            for(let r=0;r<8;r++) for(let c=0;c<8;c++){ if(b[r][c]===color && getMoves(b,r,c,color).length>0){ enPassantTarget=oldEP; return true; } }
            enPassantTarget = oldEP; return false;
        }

        function getMoves(b,r,c,color){
            const moves=[]; const dir=color==='w'?-1:1; const start=color==='w'?6:1;
            if(r+dir >=0 && r+dir <8 && b[r+dir] && b[r+dir][c]===null){
                moves.push({from:{r,c},to:{r:r+dir,c},type:'move'});
                if(r===start && r+dir*2 >=0 && r+dir*2 <8 && b[r+dir*2][c]===null) moves.push({from:{r,c},to:{r:r+dir*2,c},type:'move', setsEnPassant:{r:r+dir,c}});
            }
            [-1,1].forEach(dc=>{ const nr=r+dir, nc=c+dc; if(nr>=0&&nr<8&&nc>=0&&nc<8){ if(b[nr][nc] && b[nr][nc]!==color) moves.push({from:{r,c},to:{r:nr,c:nc},type:'capture'}); if(enPassantTarget && enPassantTarget.r === nr && enPassantTarget.c === nc && b[nr][nc] === null) moves.push({from:{r,c},to:{r:nr,c:nc},type:'enpassant', capturedPawn:{r:r,c:nc}}); } });
            return moves;
        }

        function getAllMoves(b,color,epTarget=null){
            let all=[]; const oldEP = enPassantTarget; enPassantTarget = epTarget;
            for(let r=0;r<8;r++) for(let c=0;c<8;c++){ if(b[r][c]===color) all.push(...getMoves(b,r,c,color)); }
            enPassantTarget = oldEP; return all;
        }

        function makeMove(b,move){ const nb = b.map(row=>[...row]); nb[move.to.r][move.to.c] = nb[move.from.r][move.from.c]; nb[move.from.r][move.from.c] = null; if(move.type==='enpassant') nb[move.capturedPawn.r][move.capturedPawn.c] = null; return nb; }
        function checkWin(b){ for(let c=0;c<8;c++){ if(b[0][c]==='w') return 'white'; if(b[7][c]==='b') return 'black'; } return null; }
        function evaluateBoard(b){ let score=0; for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const p=b[r][c]; if(!p) continue; if(p==='w'){ score += 100; score += (6 - r) * 12; if(r===1) score += 500; if(r===0) score += 10000; } else { score -= 100; score -= (r - 1) * 12; if(r===6) score -= 500; if(r===7) score -= 10000; } if(c>=2 && c<=5) score += p==='w'?7:-7; } return score; }
        function minimax(b, depth, alpha, beta, isMax, epState=null){
            const win = checkWin(b); if(win==='white') return 100000 + depth; if(win==='black') return -100000 - depth; if(depth===0) return evaluateBoard(b);
            const moves = getAllMoves(b, isMax?'w':'b', epState); if(moves.length===0) return isMax?-99999:99999;
            moves.sort((a,b)=>{ const valA = (a.type==='capture'||a.type==='enpassant')?-200:0 + (7-a.to.r)*30; const valB = (b.type==='capture'||b.type==='enpassant')?-200:0 + (7-b.to.r)*30; return valA-valB; });
            if(isMax){ let maxEval = -Infinity; for(const m of moves){ const newEP = m.setsEnPassant ? m.setsEnPassant : null; const val = minimax(makeMove(b,m), depth-1, alpha, beta, false, newEP); maxEval = Math.max(maxEval,val); alpha = Math.max(alpha,val); if(beta<=alpha) break; } return maxEval; }
            else { let minEval = Infinity; for(const m of moves){ const newEP = m.setsEnPassant ? m.setsEnPassant : null; const val = minimax(makeMove(b,m), depth-1, alpha, beta, true, newEP); minEval = Math.min(minEval,val); beta = Math.min(beta,val); if(beta<=alpha) break; } return minEval; }
        }
        function getBestMove(){ const moves = getAllMoves(currentBoard,'b', enPassantTarget); if(moves.length === 0) return null; let best = null; let bestVal = Infinity; moves.sort((a,b)=>{ const valA = (a.type==='capture'||a.type==='enpassant')?-200:0 + (7-a.to.r)*30; const valB = (b.type==='capture'||b.type==='enpassant')?-200:0 + (7-b.to.r)*30; return valA-valB; }); for(const m of moves){ const newEP = m.setsEnPassant ? m.setsEnPassant : null; const val = minimax(makeMove(currentBoard,m), MAX_DEPTH-1, -Infinity, Infinity, true, newEP); if(val < bestVal){ bestVal=val; best=m; } } return best; }
        
        function updateHistoryUI(){ historyList.innerHTML = ''; if(history.length === 0){ historyList.innerHTML = '<p style="color:#666;text-align:center;">Wala pang galaw...</p>'; return; } history.forEach((state, i) => { const item = document.createElement('div'); item.className = `history-item ${i%2===0?'white':'black'}`; item.textContent = `${Math.floor(i/2)+1}. ${state.notation}`; historyList.appendChild(item); }); }
        function updateShareText(){ shareOutput.value = getGameText(); }
        function copyHistory(){ shareOutput.select(); navigator.clipboard.writeText(shareOutput.value).then(()=>{ copiedMsg.classList.add('show'); setTimeout(()=>copiedMsg.classList.remove('show'), 2500); }); }
        function copyFinalGame(){ finalGameText.select(); navigator.clipboard.writeText(finalGameText.value); }
        function showAnalysis(){ finalGameText.value = getGameText(); winModal.style.display='flex'; resultTitle.textContent = '📋 ANALYSIS & GAME RECORD'; resultMsg.textContent = 'Kopyahin mo ang laro para itago o ipadala sa iba.'; }
        function closeModal(){ winModal.style.display='none'; }
        function startNewGame(){ closeModal(); totalGamesPlayed++; gameCountEl.textContent = totalGamesPlayed; initBoard(); }
        function resetGame(){ if(confirm('Sigurado ka bang magsisimula ulit?')) startNewGame(); }

        function checkDraw(){ const color = turn==='white'?'w':'b'; if(!hasAnyMoves(currentBoard, color, enPassantTarget)){ gameOver = true; stopTimer(); showDraw(); return true; } return false; }
        function updateUI(){ boardEl.innerHTML=''; turnDisplay.textContent = turn.toUpperCase(); turnDisplay.style.color = turn==='white'?'#00f2ff':'#ff007f'; for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const sq=document.createElement('div'); sq.className=`square ${(r+c)%2===0?'light-sq':'dark-sq'}`; if(selected && selected.r===r && selected.c===c) sq.classList.add('selected-sq'); const hint = validMoves.find(m=>m.to.r===r&&m.to.c===c); if(hint){ const h=document.createElement('div'); h.className=(hint.type==='capture'||hint.type==='enpassant')?'capture-indicator':'move-indicator'; sq.appendChild(h); } const p=currentBoard[r][c]; if(p){ const pc=document.createElement('div'); pc.className=`piece ${p==='w'?'white-piece':'black-piece'}`; pc.textContent='♙'; sq.appendChild(pc); } if(!gameOver) sq.onclick=()=>click(r,c); boardEl.appendChild(sq); } }
        function click(r,c){ if(gameOver) return; const p=currentBoard[r][c]; const mv = validMoves.find(m=>m.to.r===r&&m.to.c===c); if(mv){ const from = toNotation(mv.from.r, mv.from.c); const to = toNotation(mv.to.r, mv.to.c); let notation; if(mv.type==='enpassant') notation = `${from}x${to} e.p.`; else if(mv.type==='capture') notation = `${from}x${to}`; else notation = `${from}-${to}`; doMove(mv, notation); if(!gameOver && !checkDraw()) setTimeout(runAi, 300); } else if(p==='w'){ selected={r,c}; validMoves=getMoves(currentBoard,r,c,'w'); playSound('select');
        } else { selected=null; validMoves=[]; } updateUI(); }
        
        // ✅ INAYOS NA PAGTATAWAG NG TUNOG
        function doMove(move, notation){ 
            currentBoard = makeMove(currentBoard,move); 
            // Hiwalay na pagtukoy para siguradong tutunog
            if(move.type==='capture' || move.type==='enpassant'){
                playSound('capture');
            }else{
                playSound('move');
            }
            enPassantTarget = move.setsEnPassant ? move.setsEnPassant : null; 
            addTime(turn); 
            const winner = checkWin(currentBoard); 
            if(winner){ 
                gameOver=true; 
                stopTimer(); 
                playSound('win'); 
                showWin(winner); 
            } else { 
                turn = turn==='white'?'black':'white'; 
                selected=null; 
                validMoves=[]; 
            } 
            saveState(notation); 
        }
        
        function runAi(){ isAiThinking=true; aiStatus.innerHTML='<span class="thinking">THINKING...</span>'; setTimeout(()=>{ if(checkDraw()){ isAiThinking=false; updateUI(); return; } const best = getBestMove(); if(best){ const from = toNotation(best.from.r, best.from.c); const to = toNotation(best.to.r, best.to.c); let notation; if(best.type==='enpassant') notation = `${from}x${to} e.p.`; else if(best.type==='capture') notation = `${from}x${to}`; else notation = `${from}-${to}`; doMove(best, notation); aiStatus.textContent='Ready'; if(!gameOver) checkDraw(); } else { gameOver=true; stopTimer(); showDraw(); } isAiThinking=false; updateUI(); },200); }
        function showWin(who){ resultTitle.textContent = who==='white'?'🏆 PANALO KA!':'😔 PANALO ANG AI!'; resultTitle.style.color = who==='white'?'#00f2ff':'#ff007f'; resultMsg.textContent = 'Nasa ibaba ang buong record ng laro mo – pwede mo itong kopyahin.'; finalGameText.value = getGameText(); winModal.style.display='flex'; }
        function showDraw(){ resultTitle.textContent = '🤝 TABLA!'; resultTitle.style.color = '#f59e0b'; resultMsg.textContent = 'Pantay ang laban! Nasa ibaba ang record ng laro.'; finalGameText.value = getGameText(); winModal.style.display='flex'; }

        document.addEventListener('click', ()=>{
            moveAudio.play().then(() => moveAudio.pause()).catch(()=>{});
        }, { once: true });

        initBoard();
    </script>

</body>
